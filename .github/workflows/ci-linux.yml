name: CI Linux

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# The build and test jobs only need to check out source code.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]

    # QApplication is constructed in CatchTests/main.cpp, so a headless
    # environment needs the offscreen QPA plugin. Set it at the job level
    # so every step (including configure / build) sees it.
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            pkg-config \
            libx11-dev \
            libxkbcommon-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            qt6-base-dev \
            qt6-base-dev-tools

      # -------------------------------------------------------------------
      # Tests use Catch2 v3 (find_package(Catch2 3) + Catch2::Catch2). Build
      # a pinned Catch2 v3 release from source and expose it through
      # CMAKE_PREFIX_PATH so the version does not depend on the distro package.
      # -------------------------------------------------------------------
      - name: Install Catch2 v3
        run: |
          catch_root="$RUNNER_TEMP/catch2"
          catch_prefix="$RUNNER_TEMP/catch2-install"
          git clone --depth 1 --branch v3.7.1 \
            https://github.com/catchorg/Catch2.git "$catch_root"
          cmake -S "$catch_root" -B "$catch_root/build" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$catch_prefix" \
            -DCATCH_BUILD_TESTING=OFF \
            -DCATCH_INSTALL_DOCS=OFF \
            -DCATCH_INSTALL_EXTRAS=OFF
          cmake --build "$catch_root/build" --target install
          echo "CATCH2_PREFIX=$catch_prefix" >> "$GITHUB_ENV"

      - name: Configure (CMake)
        run: |
          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_PREFIX_PATH="$CATCH2_PREFIX"

      # Ninja is a single-config generator; do NOT pass --config here.
      # CMAKE_BUILD_TYPE was already provided at configure time.
      - name: Build
        run: cmake --build build --parallel

      - name: Run tests
        run: ctest --test-dir build --output-on-failure
