name: CI Linux

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# The build and test jobs only need to check out source code.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]

    # QApplication is constructed in CatchTests/main.cpp, so a headless
    # environment needs the offscreen QPA plugin. Set it at the job level
    # so every step (including configure / build) sees it.
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            pkg-config \
            libx11-dev \
            libxkbcommon-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            qt6-base-dev \
            qt6-base-dev-tools

      # -------------------------------------------------------------------
      - name: Set up vcpkg
        run: |
          vcpkg_root="$RUNNER_TEMP/vcpkg"
          git clone --depth 1 https://github.com/microsoft/vcpkg.git "$vcpkg_root"
          "$vcpkg_root/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_ROOT=$vcpkg_root" >> "$GITHUB_ENV"

      - name: Configure (CMake)
        run: |
          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DREMINI_BUILD_BENCHMARKS=ON

      # Ninja is a single-config generator; do NOT pass --config here.
      # CMAKE_BUILD_TYPE was already provided at configure time.
      - name: Build
        run: cmake --build build --parallel

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

      - name: Smoke-test Markdown parser benchmark
        run: |
          ./build/benchmarks/MarkdownParserBenchmark --filter plain-prose --iterations 2 --warmup 1 --passes 1 --format json
          ./build/benchmarks/MarkdownParserBenchmark --profile stress --filter plain-prose --iterations 1 --warmup 0 --passes 1 --format json
          ./build/benchmarks/MarkdownParserBenchmark --profile high-pressure --filter plain-prose --iterations 1 --warmup 0 --passes 1 --format json
