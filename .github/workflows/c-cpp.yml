name: Qt C++

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

# Restrict the workflow token to read-only repository contents.
permissions:
  contents: read

jobs:
  build:
    # ---------------------------------------------------------------------
    # IMPORTANT: do NOT use `windows-latest` here.
    #
    # As of late 2025 `windows-latest` points to the `windows-2025-vs2026`
    # image, which ships MSVC 19.51. Qt 6.5.0's `qvarlengtharray.h` still
    # uses `stdext::checked_array_iterator`, an API that was removed from
    # newer MSVC STL versions, so every translation unit that includes a
    # Qt header fails with:
    #
    #   error C3861: 'stdext': identifier not found
    #   error C2065: 'stdext': undeclared identifier
    #
    # `windows-2022` runs VS 2022 (MSVC 19.4x), which is the toolchain
    # Qt 6.5.0 was built and tested against.
    # ---------------------------------------------------------------------
    runs-on: windows-2022

    env:
      QT_DIR: ${{ github.workspace }}\Remini\Qt\6.5.0\msvc2019_64

    steps:
    - name: Checkout Repo
      uses: actions/checkout@v4

    # ---------------------------------------------------------------------
    # The tests now use Catch2 v3 (find_package(Catch2 3) + Catch2::Catch2).
    # Install Catch2 v3 from source into a throwaway prefix and expose it via
    # CMAKE_PREFIX_PATH. The old v2 single-header download is no longer used.
    # ---------------------------------------------------------------------
    - name: Install Catch2 v3
      shell: pwsh
      run: |
        $catchRoot = "$env:RUNNER_TEMP\catch2"
        $catchPrefix = "$env:RUNNER_TEMP\catch2-install"
        git clone --depth 1 --branch v3.7.1 `
          https://github.com/catchorg/Catch2.git $catchRoot
        cmake -S $catchRoot -B "$catchRoot\build" `
          -DCMAKE_BUILD_TYPE=Release `
          -DCMAKE_INSTALL_PREFIX=$catchPrefix `
          -DCATCH_BUILD_TESTING=OFF `
          -DCATCH_INSTALL_DOCS=OFF `
          -DCATCH_INSTALL_EXTRAS=OFF
        cmake --build "$catchRoot\build" --config Release --target install
        echo "CATCH2_PREFIX=$catchPrefix" >> $env:GITHUB_ENV

    - name: Install Qt
      uses: jurplel/install-qt-action@v3
      with:
        aqtversion: '==3.1.*'
        version: '6.5.0'
        host: 'windows'
        target: 'desktop'
        arch: 'win64_msvc2019_64'
        dir: '${{ github.workspace }}\Remini'
        cache: 'true'
        cache-key-prefix: 'install-qt-action'
        setup-python: 'false'
        tools: 'tools_cmake'

    - name: Configure CMake
      shell: pwsh
      run: |
        cmake -S . -B Build -DCMAKE_BUILD_TYPE=Release `
          -DQt6_DIR="$env:QT_DIR" `
          -DCMAKE_PREFIX_PATH="$env:CATCH2_PREFIX"

    - name: Build the Qt project with CMake
      run: cmake --build Build --config Release

    - name: Deploy main executable
      shell: pwsh
      run: |
        & "$env:QT_DIR\bin\windeployqt.exe" `
          --no-translations `
          "Build\Release\Remini.exe"

    # ---------------------------------------------------------------------
    # Test target name is `CatchTests` (defined in CatchTests/CMakeLists.txt
    # via `project(CatchTests)` + `add_executable(${PROJECT_NAME} ...)`),
    # NOT `ReminiTests`. `Remini` is the main application target.
    #
    # On the MSVC generator the binaries land in
    #   Build/<target>/Release/<target>.exe
    # hence the `Build\CatchTests\Release` working directory below.
    # ---------------------------------------------------------------------
    - name: Run tests
      shell: pwsh
      working-directory: ${{ github.workspace }}\Build\CatchTests\Release
      run: |
        Write-Host "Contents:"
        Get-ChildItem
        & "$env:QT_DIR\bin\windeployqt.exe" --no-translations CatchTests.exe
        .\CatchTests.exe
